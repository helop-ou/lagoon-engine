# See CONTRIBUTING.md, "Continuous integration".
name: Tests

on:
  pull_request:
  # Keeps SonarCloud's main dashboard and its coverage current.
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that changes only Markdown skips the tests, which could
  # not fail on it. A push to `main` always runs them, so its coverage
  # stays current.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # Two commits deep: a pull request's merge commit and the base it
      # merges into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A test reads docs/codec-support.md, which must match the engine's
      # table, so that file counts as code.
      - name: See whether anything but Markdown changed
        id: diff
        env:
          READ_BY_TESTS: 'docs/codec-support\.md'
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          other="$(grep -Ev '\.md$' <<< "$changed" || true)"
          read="$(grep -Ex "$READ_BY_TESTS" <<< "$changed" || true)"
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$changed" ] && [ -z "$other$read" ]; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image's tvOS 27.2 has the 4th generation. An image whose
          # runtimes predate it has only the 3rd.
          - platform: tvOS
            simulator: Apple TV 4K (4th generation)
            fallback: Apple TV 4K (3rd generation)
          # The image has no iPhone 17 Pro.
          - platform: iOS
            simulator: iPhone 17
            fallback: iPhone 17
    env:
      # Keep in step with the local Xcode.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      # The image lacks it, and the engine compiles a Metal shader.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show toolchain
        run: xcodebuild -version

      - name: Pick the simulator
        id: simulator
        run: |
          destination="$(scripts/pick-simulator.py "${{ matrix.platform }}" "${{ matrix.simulator }}" "${{ matrix.fallback }}")"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      # Serial: in parallel on the runner's three cores, tests that wait on
      # a clock starve. Collecting diagnostics adds ten minutes to a failure.
      - name: Test
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -scheme LagoonEngine \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E ": error: |^error: |✘|\*\* (BUILD|TEST) |Test run with" build/xcodebuild.log || true
          exit "$status"

      - name: Export coverage
        run: scripts/coverage-to-sonar.py "${{ matrix.platform }}"

      - name: Keep coverage for the scan
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: build/coverage-${{ matrix.platform }}.xml
          retention-days: 1

      - name: Keep results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  # `main` requires the two unit test checks by name, and a skipped matrix
  # job reports neither. This reports them when the tests were skipped.
  unit-tests-skipped:
    name: Unit tests (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        platform: [tvOS, iOS]
    steps:
      - run: echo "Only Markdown changed, so the unit tests were skipped."

  sonar:
    name: SonarCloud scan
    needs: unit-tests
    # Skipped with the unit tests. A fork's pull request gets no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
