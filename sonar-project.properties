# SonarCloud analysis from the Tests workflow. See CONTRIBUTING.md, "Continuous integration".
sonar.organization=helop-ou
sonar.projectKey=helop-ou_lagoon-engine
# Artifacts holds the prebuilt native libraries and their headers, not engine code.
sonar.sources=Sources,scripts,.github
sonar.tests=Tests
# C needs a compilation database to be analysed, and the one C file is a small kernel.
sonar.exclusions=**/*.c,**/*.h
sonar.coverageReportPaths=coverage/coverage-tvOS.xml,coverage/coverage-iOS.xml
sonar.coverage.exclusions=scripts/**,.github/**
